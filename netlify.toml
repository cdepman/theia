[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Local development with the Netlify CLI: `netlify dev` runs Vite, the functions and the gate together.
[dev]
  command = "npm run dev:web"
  targetPort = 5173
  port = 8888

# Single-page app fallback. The Edge Function gate (netlify/edge-functions/gate.ts) runs first.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Content-Security-Policy = "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

# Built assets are fingerprinted, but the site is private: keep them out of shared caches.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "private, max-age=31536000, immutable"
