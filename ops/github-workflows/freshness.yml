# External freshness check. It runs outside Netlify, so a stopped scheduler still raises
# an alert: when the check fails, GitHub notifies the repository owner of the failed run.
#
# Requires two repository secrets:
#   THEIA_SITE_URL        e.g. https://project-theia.netlify.app
#   STATUS_CHECK_SECRET   the same value as the Netlify environment variable
name: Freshness check

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query data status
        env:
          THEIA_SITE_URL: ${{ secrets.THEIA_SITE_URL }}
          STATUS_CHECK_SECRET: ${{ secrets.STATUS_CHECK_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${THEIA_SITE_URL:-}" ] || [ -z "${STATUS_CHECK_SECRET:-}" ]; then
            echo "THEIA_SITE_URL and STATUS_CHECK_SECRET must be set as repository secrets." >&2
            exit 1
          fi
          body="$(curl --fail-with-body --silent --show-error --max-time 30 \
            -H "x-theia-status-secret: ${STATUS_CHECK_SECRET}" \
            "${THEIA_SITE_URL%/}/api/data-status")"
          echo "$body" | python3 -c '
          import json, sys
          s = json.load(sys.stdin)
          for p in s.get("problems", []):
              print("PROBLEM:", json.dumps(p))
          print("dispatcher age (s):", s["dispatcher"]["ageSeconds"], "| paused:", s["paused"])
          sys.exit(0 if s.get("ok") else 1)
          '
